{% extends "base.html" %}
{% block title %}新規登録{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css')}}" />
{% endblock %}
{% block content %}

<div class="page-auth">
  <div class="auth-wrapper">

    <form class="auth-form" method="post" action="{{ url_for('signup_process') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div>
        <input type="text" placeholder="Username" name="name" />
      </div>

      <div>
        <input type="text" placeholder="Mail" name="email" />
      </div>

      <div>
        <input type="password" placeholder="Password" name="password" />
      </div>

      <div>
        <input type="password" placeholder="Comfirm Password" name="password_confirmation" />
      </div>

      <div class="auth-button-container">
        <button class="auth-button" type="submit">Sign Up</button>

        <a class="switch-auth-mode" href="{{ url_for('top_view') }}">
          Log in here
        </a>

        {% endblock %}
      </div>
    </form>
  </div>
</div>
