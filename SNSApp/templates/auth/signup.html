{% extends "base.html" %} 
{% block title %}新規登録{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css')}}"/>
{% endblock %}

{% block content %}
<h1>新規登録</h1>

<form method="post" action="{{ url_for('signin_process') }}">
	<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

	<div>
		<label>ユーザー名</label>
		<input type="text" placeholder="ユーザー名" name="name" >
	</div>

	<div>
		<label>メールアドレス</label>
		<input type="text" placeholder="メールアドレス" name="email" >
	</div>

	<div>
		<label>パスワード</label>
		<input type="password" placeholder="パスワード" name="password" >
	</div>

	<div>
		<label>パスワード(確認用)</label>
		<input type="password" placeholder="パスワード(確認用)" name="password_confirmation">
	</div>

	<div class="auth-button-container">
		<button type="submit">新規登録</button>
	</div>
    
	<a class="switch-auth-mode" href="{{ url_for('top_view') }}">ログインはこちら</a>  
</form>
{% endblock %}
