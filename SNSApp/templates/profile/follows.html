{% extends "base.html" %}
{% block title %}フォローリスト{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">

<div class="profile-container">

  <div class="profile-container">
    <a class="back-link" href="{{ url_for('profile_view', user_id=user_id) }}">← プロフィールに戻る</a>
  </div>

  <h2>フォローリスト</h2>
  <div class="user-list">
    {% if follows and follows|length > 0 %}
      {% for u in follows %}
        <div class="user-card">
          <a href="{{ url_for('profile_view', user_id=u.id) }}">
      <span class="acatar-inline">👤</span>
      {{ u.name or ("User #" ~ u.id) }}
    </a>
        </div>
      {% endfor %}
    {% else %}
      <p class="muted">まだ誰もフォローしていません</p>
    {% endif %}
  </div>

</div>
{% endblock %}
