{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/error.css') }}">

<div class="error-container">
  <h2>400 Bad Request</h2>
  <p>リクエストが不正です</p>

  <details>
    <summary>よくある原因</summary>
    <ul>
      <li>CSRFトークンが不足/不一致</li>
      <li>フォームのmethod/enctypeが不一致</li>
      <li>入力値が不正</li>
    </ul>
  </details>

  <p><a href="{{ url_for('posts_view') }}">投稿へ戻る</a></p>
</div>
{% endblock %}
