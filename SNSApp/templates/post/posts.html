{% extends "base.html" %}
{% block title %}投稿一覧{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{url_for('static', filename='css/posts.css')}}">
{% endblock %}

{% block content %}
<div class="post-form">
	<form method="POST" action="{{ url_for('posts_process') }}">
		<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
		<textarea name="content" rows="4" placeholder="今何してる？"></textarea>
		<button type="submit">投稿</button>
	</form>
</div>

<div class="post-list">
	{% for post in posts %}
		<div class="post-card">
			<div class="post-body">{{ post }}</div>
			<a href="{{ url_for('posts_detail_view', post_id=loop.index0) }}">詳細</a>
		</div>
	{% else %}
		<p>投稿がありません</p>
	{% endfor %}
</div>
{% endblock %}
